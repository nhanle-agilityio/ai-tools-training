name: Claude Code Review

# Reviews a PR once, when it is opened or marked ready, and always posts one summary comment.
# To review again after fixes, comment `@claude review again` (handled by claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review the PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for the TaskBoard repo. Read CLAUDE.md first; its conventions and "Never" list
            are the review rules. Check for:

            1. Correctness bugs and missed edge cases in the changed code.
            2. CLAUDE.md conventions: layer order, test-first commits for bug fixes, commit scope,
               English only, no changes outside the ticket.
            3. Tests: does each change have a test that would fail without it?

            Before commenting, read the existing review threads on this PR
            (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`). Do not repeat a point
            that is already raised, fixed, or answered as "won't fix"; only report new problems.

            Use inline comments for specific lines. Only report real problems. Do not approve or
            request changes.

            Always post one summary comment, including when there are no issues ("No issues found").
            Your final answer is not shown on the PR; only what you post is. Keep a single summary by
            editing your previous one:
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "..."`
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
