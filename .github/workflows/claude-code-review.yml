name: Claude Code Review

# Reviews every PR when it is opened or updated, and posts inline comments.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review the PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for the TaskBoard repo. Read CLAUDE.md first; its conventions and "Never" list
            are the review rules. Check for:

            1. Correctness bugs and missed edge cases in the changed code.
            2. CLAUDE.md conventions: layer order, test-first commits for bug fixes, commit scope,
               English only, no changes outside the ticket.
            3. Tests: does each change have a test that would fail without it?

            Use inline comments for specific lines and one top-level comment for the summary.
            Only report real problems; say "No issues found" if there are none. Do not approve or
            request changes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
